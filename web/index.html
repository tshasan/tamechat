<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tamechat</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>tamechat</h1>
  <p id="backend">connecting…</p>
  <nav>
    <label><input type="radio" name="view" value="rendered" checked> Rendered</label>
    <label><input type="radio" name="view" value="source"> Source</label>
    <button type="button" id="export" title="One static file, no script">Download .html</button>
    <button type="button" id="new-chat">New chat</button>
  </nav>
</header>
<main id="log" aria-live="polite">
  <p id="empty">Ask anything. The model answers in a small, safe subset of HTML. Switch to Source to see it.</p>
</main>
<form id="composer">
  <textarea id="input" rows="2" placeholder="Ask something" required></textarea>
  <button id="send" type="submit">Send</button>
  <button id="stop" type="button" hidden>Stop</button>
</form>
</body>
</html>
